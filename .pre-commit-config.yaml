# Install once per clone: uv run pre-commit install
# Local hooks call `uv run` so tool versions match uv.lock.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=10000"]
      # Vendored files stay byte-identical to their pinned releases (ADR-0025).
      - id: end-of-file-fixer
        exclude: ^(src/sentinel/app/ui/static/htmx-[0-9.]+\.(min\.js|LICENSE\.txt)|tests/vendor/.*)$
      - id: trailing-whitespace
        exclude: ^(src/sentinel/app/ui/static/htmx-[0-9.]+\.(min\.js|LICENSE\.txt)|tests/vendor/.*)$
      - id: check-toml
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: detect-secrets
        name: detect-secrets
        entry: uv run detect-secrets-hook --baseline .secrets.baseline
        # Files full of SHA-256 digests: run and summary manifests, the paper artifacts'
        # manifest, the regression digests of the engine and of Sentinel, and the evidence
        # registry (the digest of each fetched source, WP18).
        exclude: ^(results/.*/(summary_)?manifest\.json|paper/generated/MANIFEST\.json|tests/fixtures/(engine_regression|sentinel_identity)\.json|docs/research/evidence/registry\.json)$
        language: system
