# WP5b (RQ4): Sentinel variants against the WP4b baselines on the same worlds, primary grid.
# Instances, scenarios and seeds of docs/experiments/plan.md (RQ4 Sentinel study). The four
# re-solving baselines are read from the WP4b run on the same worlds, not rerun; NoReaction is
# rerun (5 ms per run) to check the worlds against WP2b and WP4b.
# Run: uv run python -m sentinel.experiments.policy_study --config configs/wp5_rq4_main.toml --out results/wp5
name = "wp5_rq4_main"
base_seed = 2026         # world seed of (instance, replication) as in WP2b, shared by all policies
max_workers = 4          # processes; one task per (instance, scenario)
data_root = "data/psplib"
baseline_cache = "data/derived/baselines"
replications = 4         # replications 0-3 of WP2b (same world seeds)
deltas = [0.2, 0.3]      # on time evaluated for both; Sentinel works towards its variant's delta_D
beta = 0.10              # budget reserve of B (spec section 1.2), reported to Sentinel
review_period = 5        # T_r (spec section 8)
policies = ["no_reaction", "sentinel_full", "sentinel_no_ot", "sentinel_gate"]
deterministic_time_limit = 0.1  # T_cp per CP-SAT stage in deterministic seconds (spec section 8)
cp_seed = 0              # CP-SAT random seed; one CP-SAT worker
wp2b_results = "results/wp2/20261020-181559-6534a712/results.csv.gz"  # NoReaction makespans must match
wp4b_results = "results/wp4/20261021-152439-8892ea21/results.csv.gz"  # baselines on the same worlds
joined = ["always_substitute", "full_resolve", "full_resolve_subst", "stable_resolve_subst"]
start_estimate = false   # a Sentinel probe takes minutes; the progress lines estimate the rest

baseline = "cpsat_det"

[baselines.cpsat_det]    # as in configs/wp2_noreaction.toml, so the cached plans are reused
deterministic_time_limit = 5.0
random_seed = 2026
num_workers = 1

[pert]                   # duration multiplier X ~ PERT(a, m, b) with shape lam (spec section 2.1)
a = 0.8
m = 1.0
b = 1.6
lam = 4.0

[scenarios]              # primary grid of docs/experiments/plan.md
lambda_a = [0.0, 0.005, 0.01, 0.02]
mean_absence = [3]
lambda_s = 0.01
lambda_n = 0.02
durations_only = false

[[sets]]
name = "j30"
reference = "opt"        # C* = proven optimum
stride = 4               # every 4th instance: 120, the WP4b instances

[[sets]]
name = "j60"
reference = "hrs"        # C* = best known makespan
stride = 8               # every 8th instance: 60, a subset of the WP4b instances

[sentinel]               # shared by the variants; spec section 8 otherwise
n_stage1 = 25            # rollout budget of the WP5b study (spec section 8)
n_rollouts = 100

[variants.sentinel_full]     # full Sentinel, every choice applied at once
delta_d = 0.2
autonomy = 3

[variants.sentinel_no_ot]    # without OVERTIME: the fair comparison with the baselines
delta_d = 0.2
variant = "no_overtime"
autonomy = 3

[variants.sentinel_gate]     # full Sentinel behind the permission gate (spec section 4)
delta_d = 0.2
autonomy = 2

[summary]
bootstrap_resamples = 1000  # cluster bootstrap over instances (spec section 5.2 style)
bootstrap_seed = 2026
reference_policy = "no_reaction"  # paired differences are taken against it
references = ["full_resolve"]     # and against it
table = "table_wp5_main"
figure_prefix = "fig_wp5"
