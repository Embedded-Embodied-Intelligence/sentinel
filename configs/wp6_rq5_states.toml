# WP6b (RQ5): decision states, the deliberations of Sentinel full (Lambda = 3) that passed the
# needs gate, recorded from reruns of WP5 main-study worlds (the J30 ablation subset), and the
# stratified sample used by configs/wp6_rq5_proposals.toml and configs/wp6_rq5_explanations.toml.
# Run: uv run python scripts/record_decision_states.py --config configs/wp6_rq5_states.toml --write-sample
name = "wp6_rq5_states"
base_seed = 2026          # world seed of (instance, replication) as in WP2b and WP5
data_root = "data/psplib"
baseline_cache = "data/derived/baselines"
states_dir = "data/derived/decision_states"  # gitignored; reproducible from the seeds
max_workers = 2           # the RQ1 Ollama study may share the CPU
set_name = "j30"
reference = "opt"         # C* = proven optimum
stride = 8                # every 8th instance: the 60 of the WP5 ablation subset
lambda_a = [0.01, 0.02]
mean_absence = 3
lambda_s = 0.01
lambda_n = 0.02
replication = 0
delta_d = 0.2             # Sentinel works towards D = ceil(1.2 C*)
beta = 0.10               # budget reserve of B (spec section 1.2)
review_period = 5         # T_r
baseline_time_limit = 5.0 # cpsat_det baseline plans of WP2b
baseline_seed = 2026
wp5_results = "results/wp5/20261022-102609-e9d131b3/results.csv.gz"  # main study: same worlds
wp5_policy = "sentinel_full"

[pert]
a = 0.8
m = 1.0
b = 1.6
lam = 4.0

[sentinel]                # sentinel_full of configs/wp5_rq4_main.toml; spec section 8 otherwise
autonomy = 3
n_stage1 = 25
n_rollouts = 100
deterministic_time_limit = 0.1
cp_seed = 0

[sample]                  # strata: lambda_A x progress tercile x rule chose NOOP (12 strata)
size = 150
seed = 2026
