# WP6b (RQ5, role 3): LLM explanations of Sentinel's decisions for a project manager, checked
# for faithfulness against the DecisionRecord (spec section 10.4). States: the sample of
# configs/wp6_rq5_states.toml.
# Ollama run:  uv run python -m sentinel.experiments.explanation_study --config configs/wp6_rq5_explanations.toml --out results/wp6 --backend ollama
# Both backends (Ollama replayed from its cache, OpenRouter live and resumable; Groq: --backend groq):
#              uv run python -m sentinel.experiments.explanation_study --config configs/wp6_rq5_explanations.toml --out results/wp6 --replay ollama=data/llm_cache/rq5/ollama.jsonl
# Smoke on the scripted oracle: --backend fake --limit 3
name = "wp6_rq5_explanations"
base_seed = 2026          # LLM seed of a state, shared by the backends
states = "configs/wp6_rq5_states.toml"
cache_dir = "data/llm_cache/rq5"
store_prompts = true       # synthetic messages: full cache records; false is mandatory for real data (spec section 10)
backends = ["ollama", "openrouter"]

[explanation]
prompt_version = "v1"     # src/sentinel/llm/prompts/explain.v1.txt
max_tokens = 2048
temperature = 0.0

[backend.ollama]          # as in configs/wp6_rq1.toml
kind = "ollama"
model = "qwen2.5:7b"
digest = "sha256:2bada8a7450677000f678be90653b85d364de7db25eb5ea54136ada5f3933730"
num_ctx = 8192

[backend.groq]
kind = "groq"
model = "openai/gpt-oss-120b"
tokens_per_minute = 8000
tokens_per_day = 200000
response_format = "json_schema"
max_wait_s = 900

[backend.groq.options]
reasoning_effort = "low"
include_reasoning = false

[backend.openrouter]      # cloud (WP6c): gpt-oss-120b of the Groq smokes, served by Groq via OpenRouter (ADR-0018)
kind = "openrouter"
model = "openai/gpt-oss-120b"
response_format = "json_schema"  # best effort, as on Groq
max_wait_s = 900          # a longer rate-limit wait stops the run (resume from the cache)
# no tokens_per_minute: OpenRouter sets no limit for paid models; a 429 waits for Retry-After

[backend.openrouter.provider]  # pinned to Groq; if Groq is unavailable, order = ["cerebras"]
order = ["groq"]
allow_fallbacks = false
require_parameters = true  # the provider must take every field (seed, schema, reasoning)

[backend.openrouter.options]  # extra request fields, part of the cache key
reasoning = { effort = "low", exclude = true }  # reasoning_effort low, no reasoning text

[backend.fake]            # scripted explanations: faithful, with seeded errors at times
kind = "fake"
model = "oracle-explanations-v1"
error_rate = 0.3

[summary]
bootstrap_resamples = 2000
bootstrap_seed = 2026
table = "table_wp6_rq5_explanations"
