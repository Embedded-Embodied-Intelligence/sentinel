# Paper artifacts (WP7, ADR-0020): the result runs that the LNCS article (English) and the
# course report (Polish) cite, one table per run, keyed by its role. `uv run sentinel paper`
# reads only these runs and writes paper/generated/ (English) and paper/generated/pl/ (Polish).
# It refuses a run whose manifest is missing, not completed, a smoke run or recorded with a
# dirty tree, or whose data files (the manifest and every raw output; not the summaries, which
# `sentinel reproduce --check` regenerates) differ from the SHA-256 pinned here.
name = "paper"
out_dir = "paper/generated"

