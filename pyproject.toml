[project]
name = "sentinel"
version = "1.0.0"
description = "Goal-driven project management agent: RCPSP scheduling, Monte Carlo risk forecasts and simulated interventions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.1",
    "ortools>=9.12",
    "psplib>=0.4,<0.5",
    "pydantic>=2.10",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[dependency-groups]
dev = [
    "detect-secrets>=1.5",
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["–", "×"]  # en dash and multiplication sign of the cockpit's labels (WP8)

[tool.ruff.lint.isort]
known-first-party = ["sentinel"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# psplib ships no type information (no py.typed marker).
module = ["psplib.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not slow"]
markers = [
    "data: needs downloaded PSPLIB data in data/psplib (run scripts/fetch_psplib.py)",
    "slow: over 30 s, or a data test over 3 s; skipped by default, run with -m \"data or slow\"",
]
