# Polish names of the application's example projects (spec sections 11.2 and 11.6; WP9c
# answer 4): the showcase project of the demo, and the roles, task words and people of the
# simulator. The lists follow en.toml item by item (the same keys and lengths), so the same
# seed gives the Polish translation of an English name. A task name is a noun of the activity
# and its object in the genitive ("Implementacja API płatności"); no name has a comma, a digit
# or a full stop.

