<!doctype html>
<html lang="{{ t.lang }}" data-weekdays="{{ t.weekdays }}" data-months="{{ t.months }}" data-counter="{{ t('form.counter') }}" data-counter-full="{{ t('form.counter_full') }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{{ htmx_config }}'>
<title>{% block title %}{{ title }}{% endblock %} · Sentinel</title>
<link rel="stylesheet" href="{{ static('sentinel.css') }}">
<link rel="icon" href="{{ static('favicon.svg') }}" type="image/svg+xml">
<script src="{{ static(htmx) }}" defer></script>
<script src="{{ static('sentinel.js') }}" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'{% block body_attrs %}{% endblock %}>
<a class="skip" href="#main">{{ t("nav.skip") }}</a>
{% block shell %}
<div class="shell">
  {% include "_sidebar.html" %}
  <div class="scrim" data-drawer-close hidden></div>
  <div>
    <header class="topbar">
      <button type="button" class="btn btn-tertiary menu-button" data-drawer-open aria-expanded="false" aria-controls="sidebar">{{ icon("menu", 20) }}{{ t("nav.menu") }}</button>
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Sentinel</a>
      {% include "_lang.html" %}
    </header>
    {% if demo %}<p class="demo-note">{{ t.plural("demo.note", demo_hours) }}</p>{% endif %}
    <main id="main" class="content" tabindex="-1">
      <div id="alerts" class="alerts"></div>
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
{% endblock %}
<div id="flash" class="toast-region" role="status" aria-live="polite">{% if flash %}{% include "_toast.html" %}{% endif %}</div>
</body>
</html>
