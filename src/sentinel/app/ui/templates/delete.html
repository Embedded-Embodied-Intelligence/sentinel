{% extends "base.html" %}
{% block content %}
<div class="page-read">
  <div class="page-head"><h1>{{ t("delete.title") }}</h1></div>
  <div class="card danger-confirm-body">
    <p>{{ t("delete.text", name=name) }}</p>
    <form class="btn-row" hx-post="/projects/{{ project_id }}/delete">
      <button class="btn btn-danger">{{ t("delete.confirm") }}</button>
      <a class="btn btn-tertiary" href="/projects/{{ project_id }}">{{ t("common.cancel") }}</a>
    </form>
  </div>
</div>
{% endblock %}
