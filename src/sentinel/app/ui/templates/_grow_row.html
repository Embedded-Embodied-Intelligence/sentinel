{% import "_ui.html" as ui with context %}
<div class="row-group" data-row>
  <input type="hidden" name="grow_rows" value="{{ i }}">
  <div class="field">
    <label for="grow-{{ i }}-task">{{ t("checkin.grow.task") }}</label>
    <select id="grow-{{ i }}-task" name="grow_{{ i }}_task">
      <option value="">{{ t("checkin.grow.choose") }}</option>
      {% if running %}<optgroup label="{{ t('checkin.grow.group_running') }}">{% for task in running %}<option value="{{ task.key }}"{% if fv('grow_' ~ i ~ '_task', '') == task.key %} selected{% endif %}>{{ task.name }}</option>{% endfor %}</optgroup>{% endif %}
      {% if startable %}<optgroup label="{{ t('checkin.grow.group_unstarted') }}">{% for task in startable %}<option value="{{ task.key }}"{% if fv('grow_' ~ i ~ '_task', '') == task.key %} selected{% endif %}>{{ task.name }}</option>{% endfor %}</optgroup>{% endif %}
    </select>
  </div>
  <div class="field">
    <label for="grow-{{ i }}-days">{{ t("checkin.grow.days") }}</label>
    <input id="grow-{{ i }}-days" name="grow_{{ i }}_days" inputmode="decimal" class="input-short" value="{{ fv('grow_' ~ i ~ '_days', '') }}">
    {{ ui.field_error("grow-" ~ i ~ "-days", errors.get('grow_' ~ i ~ '_days')) }}
  </div>
  <button type="button" class="btn btn-tertiary btn-sm" data-remove-row>{{ t("setup.remove") }}</button>
</div>
