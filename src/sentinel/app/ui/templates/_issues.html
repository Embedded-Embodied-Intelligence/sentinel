{% import "_ui.html" as ui with context %}
<div id="issues"{% if oob %} hx-swap-oob="true"{% endif %}>
  {% if issues %}
  {% call ui.callout("warn", t("setup.issues_title")) %}
    <ul>{% for issue in issues %}<li id="issue-{{ loop.index }}">{{ issue.message }}</li>{% endfor %}</ul>
  {% endcall %}
  {% endif %}
</div>
